services:
  - type: web
    name: recruitai-backend
    env: python
    rootDir: backend
    buildCommand: "pip install -r requirements.txt && python -m spacy download en_core_web_sm"
    startCommand: "uvicorn main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: DATABASE_URL
        value: sqlite:///./recruiter_ats.db
      - key: MAX_FILE_SIZE_MB
        value: "5"
      - key: UPLOAD_DIR
        value: temp_uploads
      - key: OUTPUT_DIR
        value: output
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
